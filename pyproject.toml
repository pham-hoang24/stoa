[project]
name = "stoa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "z0rhan", email = "uknowme1928@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
  "ifcopenshell",
  "ezdxf",
  "pymupdf",
  "opencv-python",
  "numpy",
  "openai",
  "python-dotenv",
]

[project.scripts]
stoa = "stoa:main"
stoa-chat = "stoa_chat.__main__:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "backend/tests"]
filterwarnings = ["ignore::FutureWarning"]

[tool.uv.build-backend]
module-root = "backend/src"
module-name = ["stoa", "stoa_chat"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
